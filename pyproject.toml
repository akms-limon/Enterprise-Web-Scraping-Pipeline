[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-web-scraping-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Scrapy==2.19.0",
    "scrapyd==1.6.0",
    "scrapyd-client==2.0.3",
]

[project.entry-points."scrapy"]
settings = "books_scraper.settings"
